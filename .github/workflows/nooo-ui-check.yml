name: NOOO UI checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'tests/**'
      - 'scripts/validate-content.mjs'
      - 'package.json'
      - '.github/workflows/nooo-ui-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check assets/js/comic-helper.js
