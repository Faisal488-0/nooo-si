# NOOO HOURLY CREATIVE ENGINE
# Every hour: generate one new original card → validate + test → commit (safely) → deploy to
# GitHub Pages in this same run → confirm it is live on https://nooo.si.
# Independent of Claude, no paid APIs, no secrets. Docs: docs/NOOO_HOURLY_OPERATIONS.md

name: NOOO Hourly Refresh

on:
  schedule:
    - cron: '17 * * * *'   # minute 17 of every hour, UTC. GitHub may delay or skip runs under load.
  workflow_dispatch:
    inputs:
      skip_generation:
        description: 'Only validate and redeploy (do not add a card)'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nooo-content-and-deploy
  cancel-in-progress: false

env:
  SITE_URL: https://nooo.si

jobs:
  check:
    name: Validate & test (push / PR)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  hourly:
    name: Generate, publish, verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # commit the new card
      pages: write      # request / deploy the Pages build
      id-token: write   # required by actions/deploy-pages when Pages source = GitHub Actions
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (lockfile, no dependencies)
        run: npm ci

      - name: Pre-flight — existing content must be healthy
        run: npm run check

      - name: Generate one new card
        id: gen
        if: ${{ !inputs.skip_generation }}
        run: |
          set +e
          node scripts/hourly-content-generator.mjs
          code=$?
          if [ "$code" = "3" ]; then
            echo "::error title=CONTENT_POOL_EXHAUSTED::No new acceptable combination left. Add lines to content/banks/*.json (see docs/NOOO_HOURLY_OPERATIONS.md). Nothing was published."
          fi
          exit $code

      - name: Validate + full test suite after generation
        run: npm run check

      - name: Commit the new card (no empty commits)
        id: commit
        if: ${{ !inputs.skip_generation }}
        run: |
          if [ -z "$(git status --porcelain -- data/feed)" ]; then
            echo "::error::Generator reported success but no feed file changed. Refusing to publish."
            exit 1
          fi
          unexpected="$(git status --porcelain | grep -v ' data/feed/' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files changed:"; echo "$unexpected"; exit 1
          fi
          git config user.name "nooo-hourly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed
          git commit -m "content: hourly NOOO card ${{ steps.gen.outputs.item_id }}" \
                     -m "Generated by .github/workflows/nooo-hourly.yml (template-engine-v1)." \
                     -m "Note for ChatGPT/other assistants: data/feed/* is bot-owned. Do not hand-edit; add lines to content/banks/*.json instead."
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push safely (rebase on new commits, stop on conflict, never force)
        if: ${{ !inputs.skip_generation }}
        run: bash scripts/safe-push.sh "${{ github.event.repository.default_branch }}" origin

      - name: Detect Pages publishing mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)"
          echo "Pages build_type: $mode"
          echo "build_type=$mode" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # --- Mode A: Pages source = "GitHub Actions" → deploy the artifact right here.
      - name: Build _site
        if: steps.mode.outputs.build_type == 'workflow'
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.build_type == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.build_type == 'workflow'
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v4

      # --- Mode B: Pages source = "Deploy from a branch" → explicitly request a build of the
      # pushed commit (do not rely on a GITHUB_TOKEN push to trigger it) and wait for it.
      - name: Request + wait for branch Pages build
        if: steps.mode.outputs.build_type != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.mode.outputs.sha }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 \
            && echo "Pages build requested." \
            || echo "::warning::Could not request a Pages build via API; relying on the push-triggered build."
          for i in $(seq 1 40); do
            read -r status commit <<<"$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '[.status, .commit] | @tsv' 2>/dev/null || echo 'unknown none')"
            echo "[$i] latest build: status=$status commit=${commit:0:7} (want ${SHA:0:7})"
            if [ "$commit" = "$SHA" ] && [ "$status" = "built" ]; then echo "Pages build finished."; exit 0; fi
            if [ "$commit" = "$SHA" ] && [ "$status" = "errored" ]; then echo "::error::Pages build errored."; exit 1; fi
            sleep 15
          done
          echo "::warning::Did not see the Pages build finish within 10 minutes; continuing to live verification."

      - name: Verify the new card is live on nooo.si
        if: ${{ !inputs.skip_generation }}
        env:
          WANT: ${{ steps.gen.outputs.item_id }}
        run: |
          for i in $(seq 1 30); do
            q="data/feed/latest.json?nocache=$(date +%s)-$i"
            got="$( (curl -fsSL --max-time 20 "$SITE_URL/$q" || curl -fsSL --max-time 20 "http://nooo.si/$q") | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).items[0].id)}catch{console.log("unreadable")}})' || echo "fetch-failed")"
            echo "[$i] live newest card: $got"
            if [ "$got" = "$WANT" ]; then
              echo "VERIFIED: $WANT is live on $SITE_URL"
              {
                echo "## ✅ New NOOO card is live"
                echo "- Card: \`$WANT\` (${{ steps.gen.outputs.category }})"
                echo "- Commit: \`${{ steps.mode.outputs.sha }}\`"
                echo "- Pages mode: \`${{ steps.mode.outputs.build_type }}\`"
                echo "- Verified at: $(date -u +%FT%TZ) on $SITE_URL"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Committed $WANT but could not confirm it on $SITE_URL within 15 minutes (DNS, HTTPS or Pages may be pending)."
          echo "## ⚠️ Card committed but NOT confirmed live: \`$WANT\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1
